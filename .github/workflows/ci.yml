name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: node test/model.test.js

      - name: Python helpers compile
        run: python3 -m py_compile scripts/*.py

      - name: Manifest matches the repo and the README
        run: python3 .github/check-manifest.py

      # The tag and the manifest have to agree, or the marketplace lists a
      # version the release does not match.
      - name: Tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "tag=$tag manifest=$manifest"
          test "$tag" = "$manifest"

      # QML is not linted here: qmllint needs Qt 6 plus Quickshell's own types
      # and Omarchy's shell on the import path, none of which exist on a runner.
      # CONTRIBUTING.md has the command to run locally.
